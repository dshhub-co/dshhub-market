<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">dshhub-market</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g)"/>
  <!-- 六位口令点阵（两行三列）；右上角是被点亮的「插件插头」：
       金色、微倾 9°，与 awesome-dsh-plugin 的插头语言同源 ——
       口令点亮 → 插件插入，一个标记承载两端语义。 -->
  <circle cx="40" cy="38" r="8" fill="#ffffff" opacity=".92"/>
  <circle cx="64" cy="38" r="8" fill="#ffffff" opacity=".92"/>
  <rect x="80" y="30" width="16" height="16" rx="4" fill="#fbbf24" transform="rotate(9 88 38)"/>
  <circle cx="40" cy="62" r="8" fill="#ffffff" opacity=".92"/>
  <circle cx="64" cy="62" r="8" fill="#ffffff" opacity=".92"/>
  <circle cx="88" cy="62" r="8" fill="#ffffff" opacity=".92"/>
  <!-- 底部撕票口：口令 = 一张票 -->
  <rect x="36" y="92" width="56" height="8" rx="4" fill="#ffffff" opacity=".28"/>
</svg>
